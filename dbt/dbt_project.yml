name: "morgan_bowl_dbt"
version: "1.0.0"
config-version: 2

profile: "morgan-bowl"

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

dispatch:
  - macro_namespace: dbt
    search_order: [dbt, dbt_duckdb]

# Project variables - configure these for your league
vars:
  league_size: 12  # Total number of teams in the league
  playoff_teams: 6  # Number of teams that make playoffs (top half)

models:
  morgan_bowl_dbt:
    +schema: analytics
    +materialized: table
    staging:
      +schema: staging
      +materialized: view
      tests:
        - assert_two_rosters_per_matchup
    intermediate:
      +schema: analytics
      +materialized: ephemeral
      +tags: ['intermediate']
    marts:
      +schema: analytics
      +materialized: table
