version: 2

models:
  - name: stg_league
    description: "League metadata with standardized field names and configuration settings."
    columns:
      - name: league_id
        tests:
          - not_null
          - unique
      - name: name
        description: "League display name from Sleeper."
      - name: season
        description: "Season year (e.g., '2025')."
      - name: total_rosters
        description: "Total number of teams in the league."
        tests:
          - not_null
      - name: playoff_teams
        description: "Number of teams that make the playoffs."
        tests:
          - not_null
      - name: playoff_week_start
        description: "Week number when playoffs begin."
      - name: status
        description: "League status: 'pre_draft', 'drafting', 'in_season', or 'complete'."
  - name: stg_users
    description: "Normalized view of Sleeper users for the league."
    columns:
      - name: user_id
        tests:
          - not_null
          - unique
  - name: stg_rosters
    description: "Normalized roster view including owner relationships."
    columns:
      - name: roster_id
        tests:
          - not_null
          - unique
      - name: owner_id
        tests:
          - not_null
  - name: stg_matchups
    description: "Union of matchup results across ingested weeks."
    columns:
      - name: week
        tests:
          - not_null
      - name: matchup_id
        tests:
          - not_null
      - name: roster_id
        tests:
          - not_null
