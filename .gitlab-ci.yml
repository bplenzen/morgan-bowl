# GitLab CI/CD Pipeline for Morgan Bowl Fantasy Football Data Pipeline
# This pipeline runs weekly to ingest fantasy football data and update analytics

# Define stages
stages:
  - ingest
  - build
  - test
  - deploy

# Global variables
variables:
  # Python version to use
  PYTHON_VERSION: "3.11"
  # Poetry version
  POETRY_VERSION: "1.8.2"

# Template for Python setup (reusable)
.python-setup: &python-setup
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y curl git
    - curl -sSL https://install.python-poetry.org | python3 - --version $POETRY_VERSION
    - export PATH="/root/.local/bin:$PATH"
    - poetry --version
    - poetry config virtualenvs.in-project true
    - poetry install --no-interaction --no-ansi
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .venv/
      - data/

# Job 1: Weekly Data Ingestion
ingest:weekly:
  <<: *python-setup
  stage: ingest
  script:
    - echo "🏈 Starting weekly data ingestion..."
    - echo "📋 Checking environment variables..."
    - |
      if [ -n "$SLEEPER_LEAGUE_ID" ]; then
        echo "SLEEPER_LEAGUE_ID is set: YES"
      else
        echo "SLEEPER_LEAGUE_ID is set: NO"
      fi
    - |
      if [ -n "$SLEEPER_SEASON" ]; then
        echo "SLEEPER_SEASON is set: YES"
      else
        echo "SLEEPER_SEASON is set: NO"
      fi
    - export SLEEPER_LEAGUE_ID="${SLEEPER_LEAGUE_ID}"
    - export SLEEPER_SEASON="${SLEEPER_SEASON}"
    - poetry run python scripts/weekly_ingestion.py
  artifacts:
    # Store the database file so downstream jobs can use it
    paths:
      - data/warehouse.duckdb
    expire_in: 7 days
  # Only run on scheduled pipelines (not on every commit)
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"  # Also allow manual runs
  environment:
    name: production

# Job 2: DBT Build (compile and run all models)
dbt_build:
  <<: *python-setup
  stage: build
  script:
    - echo "🔨 Building dbt models..."
    - cd dbt
    - poetry run dbt deps
    - poetry run dbt build --target ci
  needs:
    - ingest:weekly
  artifacts:
    paths:
      - dbt/target/run_results.json
      - dbt/target/manifest.json
      - dbt/target/catalog.json
    reports:
      junit: dbt/target/run_results.json
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  coverage: '/PASS=(\d+)/'

# Job 3: Run DBT Tests
test:dbt:
  <<: *python-setup
  stage: test
  script:
    - echo "🧪 Running DBT tests..."
    - cd dbt
    - poetry run dbt test --store-failures
  needs:
    - ingest:weekly
  artifacts:
    paths:
      - dbt/target/run_results.json
    when: always  # Store even on failure
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# Job 4: Run Python Unit Tests
test:python_unit:
  <<: *python-setup
  stage: test
  script:
    - echo "🧪 Running Python unit tests..."
    - poetry run pytest tests/ingestion/ -v --junitxml=unit_report.xml
  artifacts:
    reports:
      junit: unit_report.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# Job 5: Run API Parity Tests (Data Validation)
test:api_parity:
  <<: *python-setup
  stage: test
  script:
    - echo "🔍 Validating data against Sleeper API (SOURCE OF TRUTH)..."
    - poetry run pytest tests/integration/test_api_parity.py -v --junitxml=api_parity_report.xml
  needs:
    - ingest:weekly
  artifacts:
    reports:
      junit: api_parity_report.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: false  # CRITICAL: Block pipeline if data doesn't match API

# Job 6: Commit and Push Updated Data
# After successful ingestion and tests, commit the updated database
commit:data:
  stage: deploy
  image: alpine/git:latest
  script:
    - echo "📝 Committing updated data to repository..."
    - apk add --no-cache git
    - git config user.email "ci@morgan-bowl.pipeline"
    - git config user.name "Morgan Bowl CI/CD"
    # Fetch latest to avoid conflicts
    - git fetch origin main
    - git checkout main
    - git pull origin main
    # Stage the updated database
    - git add data/warehouse.duckdb
    # Only commit if there are changes
    - |
      if git diff --staged --quiet; then
        echo "ℹ️ No changes to database, skipping commit"
      else
        git commit -m "data: Weekly ingestion update $(date +%Y-%m-%d)

        Automated data update from GitLab CI/CD pipeline
        - Updated warehouse.duckdb with latest Sleeper data
        - Pipeline: $CI_PIPELINE_URL
        - Triggered: $CI_PIPELINE_SOURCE"
        git push https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/bplenzen/morgan-bowl.git HEAD:main
        echo "✅ Successfully pushed updated data to GitLab"
      fi
  needs:
    - ingest:weekly
    - test:dbt
    - test:api_parity
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  when: manual
  allow_failure: true  # Don't block pipeline if commit fails

# Job 7: Mirror to GitHub (for Streamlit Cloud deployment)
# Streamlit Cloud only supports GitHub, so we auto-mirror all commits
mirror:github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh-client
  script:
    - echo "🔄 Mirroring to GitHub for Streamlit Cloud..."
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$GITHUB_DEPLOY_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git config --global user.email "ci@morgan-bowl.pipeline"
    - git config --global user.name "Morgan Bowl CI/CD"
    - git remote add github git@github.com:bplenzen/morgan-bowl.git || true
    - git push github HEAD:main --force
    - echo "✅ Successfully mirrored to GitHub"
  needs:
    - job: commit:data
      optional: true  # Only needed if commit:data ran (scheduled pipelines)
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: true  # Don't block pipeline if GitHub mirror fails

# Optional: Manual trigger job (run anytime)
ingest:manual:
  <<: *python-setup
  stage: ingest
  script:
    - echo "🏈 Manual data ingestion triggered..."
    - poetry run python scripts/weekly_ingestion.py
  artifacts:
    paths:
      - data/warehouse.duckdb
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
